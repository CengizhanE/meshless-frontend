<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meshless.ai | CFD Engine</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* This acts as the clipping mask for the whole screen */
            background-color: #0e1117; 
        }
        
        .streamlit-container {
            position: absolute;
            top: -2px; /* Pushes the top white border off-screen */
            left: -2px; /* Pushes the left white border off-screen */
            width: calc(100% + 4px); /* Compensates for the shift so the right border goes off-screen */
            height: calc(100% + 45px); /* Pushes the 45px Streamlit footer entirely off the bottom of the screen */
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="streamlit-container">
        <iframe src="https://meshless-inference.streamlit.app/?embed=true&embed_options=dark_theme" frameborder="0"></iframe>
    </div>
</body>
</html>
