<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meshless.ai | CFD Engine</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            background-color: #0e1117; 
        }
        
        .streamlit-container {
            position: absolute;
            top: -12px;  /* Pushes the top rounded corners entirely off-screen */
            left: -12px; /* Pushes the left rounded corners entirely off-screen */
            width: calc(100% + 24px); /* Compensates for both left and right shifts (12px + 12px) */
            height: calc(100% + 57px); /* Compensates for the 12px top shift AND the 45px bottom footer */
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="streamlit-container">
        <iframe src="https://meshless-inference.streamlit.app/?embed=true&embed_options=dark_theme" frameborder="0"></iframe>
    </div>
</body>
</html>
